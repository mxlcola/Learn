<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">牙齿基础解剖示意图</title>
  <desc id="desc">展示牙釉质、牙本质、髓腔、根管、牙髓和根尖孔的位置。</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}.tooth{fill:#fff;stroke:#163f72;stroke-width:6;stroke-linejoin:round}.enamel{fill:#f5fbff;stroke:#8bb9df;stroke-width:4}.dentin{fill:#dceeff;stroke:#4b87be;stroke-width:4}.pulp{fill:#f06a6a;stroke:#a42b2b;stroke-width:4}.canal{fill:#f7a7a7;stroke:#a42b2b;stroke-width:3}.bone{fill:#d7ecff;stroke:#8dbbde;stroke-width:3}.label{font:30px sans-serif;fill:#17324d}.small{font:24px sans-serif;fill:#17324d}.line{stroke:#2463a6;stroke-width:4;fill:none;marker-end:url(#arrow)}.pin{fill:#2463a6}.box{fill:#fff;stroke:#b8d5ed;stroke-width:2;rx:12}.red{fill:#b72222}.blue{fill:#2463a6}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2463a6"/>
