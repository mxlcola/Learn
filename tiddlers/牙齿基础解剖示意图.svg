  <path class="line" d="M765 130 L617 143"/>
  <rect class="box" x="770" y="101" width="180" height="58"/>
  <text class="small" x="790" y="139">牙釉质</text>
  <path class="line" d="M770 215 L610 230"/>
  <rect class="box" x="775" y="187" width="180" height="58"/>
  <text class="small" x="795" y="225">牙本质</text>
