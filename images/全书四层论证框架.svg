<svg viewBox="0 0 680 512" width="100%" style="max-width:680px;height:auto" role="img" xmlns="http://www.w3.org/2000/svg">
<title>《我们为什么吃（太多）》四层论证框架</title>
<desc>从「为什么少吃多动无效」这一问题出发，依次经过调节系统、定点升高、激素信号、干预路径四层推演，落到「肥胖是调节问题而非算术问题」的结论。</desc>
<defs>
<marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="600" height="44" rx="8" fill="#F7F7F5" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="40" y="40" width="3" height="44" fill="#5F5E5A"/>
<text x="60" y="62" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">问题：为什么「少吃多动」治不好肥胖？</text>
<path d="M340 84 L340 106" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
<rect x="40" y="108" width="600" height="60" rx="8" fill="#F7F7F5" stroke="#185FA5" stroke-width="0.5"/>
<rect x="40" y="108" width="3" height="60" fill="#185FA5"/>
<text x="60" y="130" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第一层 · 调节系统是什么</text>
<text x="60" y="150" font-size="12" fill="#5F5E5A" dominant-baseline="central">脂肪 → 瘦体素 → 下丘脑负反馈 → 体重定点（设定值由潜意识计算）</text>
<path d="M340 168 L340 190" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
<rect x="40" y="192" width="600" height="60" rx="8" fill="#F7F7F5" stroke="#185FA5" stroke-width="0.5"/>
<rect x="40" y="192" width="3" height="60" fill="#185FA5"/>
<text x="60" y="214" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第二层 · 定点为何被推高</text>
<text x="60" y="234" font-size="12" fill="#5F5E5A" dominant-baseline="central">基因易感性 × 现代致胖环境：进化遗留、代际表观遗传、饮食政策与食品工业</text>
<path d="M340 252 L340 274" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
<rect x="40" y="276" width="600" height="60" rx="8" fill="#F7F7F5" stroke="#993C1D" stroke-width="0.5"/>
<rect x="40" y="276" width="3" height="60" fill="#993C1D"/>
<text x="60" y="298" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第三层 · 环境怎样变成激素信号</text>
<text x="60" y="318" font-size="12" fill="#5F5E5A" dominant-baseline="central">高胰岛素、欧米伽-6 过载、慢性炎症，三条支路汇入瘦体素抗性</text>
<path d="M340 336 L340 358" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
<rect x="40" y="360" width="600" height="60" rx="8" fill="#F7F7F5" stroke="#993C1D" stroke-width="0.5"/>
<rect x="40" y="360" width="3" height="60" fill="#993C1D"/>
<text x="60" y="382" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">第四层 · 什么才能真正降下来</text>
<text x="60" y="402" font-size="12" fill="#5F5E5A" dominant-baseline="central">节食被判为饥荒必败；改上游环境信号，让大脑主动下调定点（5 步）</text>
<path d="M340 420 L340 442" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow1)"/>
<rect x="40" y="444" width="600" height="48" rx="8" fill="#F7F7F5" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="40" y="444" width="3" height="48" fill="#5F5E5A"/>
<text x="60" y="468" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">结论：肥胖是调节问题，不是算术问题；干预对象是环境信号，不是热量差</text>
</svg>
